<div class="max-w-7xl mx-auto">

  <!-- Welcome Banner -->
  <app-welcome-banner [userName]="userName()" />

  <!-- Error -->
  @if (error()) {
    <div class="mb-6 p-4 rounded-xl bg-red-50 border border-red-200 text-red-700 flex items-center gap-3">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
      {{ error() }}
    </div>
  }

  <!-- Section Title -->
  <div class="flex items-center gap-3 mb-5">
    <div class="w-1 h-6 rounded-full" style="background: linear-gradient(to bottom, #6366f1, #a855f7);"></div>
    <h2 class="text-lg font-bold text-slate-700">Overview</h2>
  </div>

  <!-- KPI Cards Grid -->
  <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-5">
    @for (card of cards; track card.key) {
      <app-stat-card
        [label]="card.label"
        [count]="getCount(card.key)"
        [subtitle]="card.subtitle"
        [gradient]="card.gradient"
        [icon]="card.icon"
      />
    }
  </div>

  <!-- Quick Links -->
  <div class="mt-8">
    <div class="flex items-center gap-3 mb-5">
      <div class="w-1 h-6 rounded-full" style="background: linear-gradient(to bottom, #6366f1, #a855f7);"></div>
      <h2 class="text-lg font-bold text-slate-700">Quick Actions</h2>
    </div>
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <a routerLink="/employees"
         class="flex items-center gap-4 p-5 bg-white rounded-2xl border border-slate-100 shadow-sm
                hover:shadow-md hover:-translate-y-0.5 transition-all duration-200 group">
        <div class="w-12 h-12 rounded-xl flex items-center justify-center"
             style="background: linear-gradient(135deg, #6366f1, #a855f7);">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/>
          </svg>
        </div>
        <div>
          <p class="font-semibold text-slate-800 group-hover:text-indigo-600 transition-colors">Manage Employees</p>
          <p class="text-sm text-slate-500">Add, edit, view employees</p>
        </div>
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-slate-300 group-hover:text-indigo-400 ml-auto transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
        </svg>
      </a>

      <div class="flex items-center gap-4 p-5 bg-white rounded-2xl border border-slate-100 shadow-sm">
        <div class="w-12 h-12 rounded-xl flex items-center justify-center"
             style="background: linear-gradient(135deg, #10b981, #0d9488);">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
          </svg>
        </div>
        <div>
          <p class="font-semibold text-slate-800">Reports</p>
          <p class="text-sm text-slate-500">Export employee data</p>
        </div>
        <span class="ml-auto text-xs px-2 py-1 rounded-full bg-slate-100 text-slate-500 font-medium">Soon</span>
      </div>
    </div>
  </div>
</div>
