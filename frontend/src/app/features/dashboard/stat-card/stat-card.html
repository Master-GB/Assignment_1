<div class="relative bg-white rounded-2xl shadow-sm border border-slate-100 p-6 overflow-hidden
            hover:shadow-lg hover:-translate-y-1 transition-all duration-300 cursor-default group">

  <!-- Decorative gradient blob -->
  <div class="absolute -top-4 -right-4 w-24 h-24 rounded-full opacity-15 group-hover:opacity-25 transition-opacity duration-300"
       [ngClass]="'bg-gradient-to-br ' + gradient"></div>

  <!-- Content -->
  <div class="flex items-start justify-between">

    <!-- Icon -->
    <div class="w-14 h-14 rounded-2xl flex items-center justify-center shrink-0"
         [ngClass]="'bg-gradient-to-br ' + gradient">
      <span class="text-white text-2xl" [innerHTML]="icon"></span>
    </div>

    <!-- Trend badge -->
    @if (trend !== null) {
      <span class="text-xs font-semibold px-2 py-1 rounded-full"
            [class]="trend >= 0 ? 'bg-emerald-100 text-emerald-700' : 'bg-red-100 text-red-600'">
        {{ trend >= 0 ? '↑' : '↓' }} {{ trend | number:'1.0-1' }}%
      </span>
    }
  </div>

  <!-- Stats -->
  <div class="mt-4">
    @if (count === null) {
      <div class="h-10 w-24 bg-slate-100 rounded-xl animate-pulse"></div>
    } @else {
      <p class="text-4xl font-extrabold text-slate-800 tabular-nums">{{ count | number }}</p>
    }
    <p class="mt-1 text-sm font-semibold text-slate-600">{{ label }}</p>
    @if (subtitle) {
      <p class="text-xs text-slate-400 mt-0.5">{{ subtitle }}</p>
    }
  </div>

  <!-- Bottom bar -->
  <div class="mt-5 h-1.5 rounded-full bg-slate-100 overflow-hidden">
    <div class="h-full rounded-full transition-all duration-1000"
         [ngClass]="'bg-gradient-to-r ' + gradient"
         [style.width]="count !== null ? '70%' : '0%'">
    </div>
  </div>
</div>
