<div class="relative rounded-2xl overflow-hidden p-8 mb-6"
     style="background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #db2777 100%);">

  <!-- Decorative circles -->
  <div class="absolute top-0 right-0 w-64 h-64 rounded-full opacity-10"
       style="background: white; transform: translate(30%, -30%);"></div>
  <div class="absolute bottom-0 right-32 w-32 h-32 rounded-full opacity-10"
       style="background: white; transform: translate(0%, 50%);"></div>

  <div class="relative z-10 flex items-center justify-between flex-wrap gap-4">
    <div>
      <p class="text-purple-200 text-sm font-medium">{{ formattedDate }}</p>
      <h1 class="text-white text-3xl font-extrabold mt-1">
        {{ greeting }}, {{ userName }} 👋
      </h1>
      <p class="text-purple-200 mt-2 text-sm">
        Here's what's happening in your organization today.
      </p>
    </div>

    <!-- Illustration icon -->
    <div class="hidden sm:flex w-20 h-20 rounded-2xl items-center justify-center"
         style="background: rgba(255,255,255,0.15); backdrop-filter: blur(8px);">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-10 h-10 text-white" fill="none"
           viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
              d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
      </svg>
    </div>
  </div>
</div>
