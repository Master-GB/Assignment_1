<div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6">

  <div class="flex items-center gap-3 mb-5">
    <div class="w-8 h-8 rounded-lg flex items-center justify-center"
      style="background: linear-gradient(135deg, #6366f1, #a855f7);">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24"
        stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
      </svg>
    </div>
    <h3 class="font-semibold text-slate-700">Search Employees</h3>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">

    <!-- Employee Code -->
    <div class="flex flex-col gap-1.5">
      <label class="text-xs font-semibold text-slate-500 uppercase tracking-wide">Employee Code</label>
      <input id="search-employee-code" type="text" [(ngModel)]="employeeCode" placeholder="e.g. EMP001" class="px-4 py-2.5 rounded-xl border border-slate-200 text-sm text-slate-700 placeholder-slate-400
               focus:outline-none focus:ring-2 focus:ring-indigo-300 focus:border-indigo-400 transition-all" />
    </div>

    <!-- NIC -->
    <div class="flex flex-col gap-1.5">
      <label class="text-xs font-semibold text-slate-500 uppercase tracking-wide">NIC</label>
      <input id="search-nic" type="text" [(ngModel)]="nic" placeholder="e.g. 199512345678" class="px-4 py-2.5 rounded-xl border border-slate-200 text-sm text-slate-700 placeholder-slate-400
               focus:outline-none focus:ring-2 focus:ring-indigo-300 focus:border-indigo-400 transition-all" />
    </div>

    <!-- Name -->
    <div class="flex flex-col gap-1.5">
      <label class="text-xs font-semibold text-slate-500 uppercase tracking-wide">Employee Name</label>
      <input id="search-name" type="text" [(ngModel)]="name" placeholder="e.g. gihan" class="px-4 py-2.5 rounded-xl border border-slate-200 text-sm text-slate-700 placeholder-slate-400
               focus:outline-none focus:ring-2 focus:ring-indigo-300 focus:border-indigo-400 transition-all" />
    </div>

    <!-- Status -->
    <div class="flex flex-col gap-1.5">
      <label class="text-xs font-semibold text-slate-500 uppercase tracking-wide">Status</label>
      <select id="search-status" [(ngModel)]="status" class="px-4 py-2.5 rounded-xl border border-slate-200 text-sm text-slate-700 bg-white
               focus:outline-none focus:ring-2 focus:ring-indigo-300 focus:border-indigo-400 transition-all">
        <option value="ALL">All</option>
        <option value="ACTIVE">Active</option>
        <option value="INACTIVE">Inactive</option>
      </select>
    </div>
  </div>

  <!-- Action Buttons -->
  <div class="flex items-center gap-3 mt-5 pt-5 border-t border-slate-100">
    <button id="btn-search" (click)="onSearch()" class="flex items-center gap-2 px-5 py-2.5 rounded-xl text-white text-sm font-semibold
             transition-all duration-200 hover:shadow-lg hover:-translate-y-0.5 active:translate-y-0"
      style="background: linear-gradient(135deg, #6366f1, #a855f7);">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
      </svg>
      Search
    </button>
    <button id="btn-reset" (click)="onReset()" class="flex items-center gap-2 px-5 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200
             text-slate-600 text-sm font-semibold transition-all duration-200">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
      </svg>
      Reset
    </button>
  </div>
</div>
