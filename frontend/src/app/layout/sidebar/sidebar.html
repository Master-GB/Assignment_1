<aside
  class="h-screen flex flex-col transition-all duration-300 ease-in-out select-none"
  [class]="collapsed() ? 'w-20' : 'w-64'"
  style="background: linear-gradient(180deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);"
>
  <!-- Logo & Brand -->
  <div class="flex items-center px-4 py-5 border-b border-white/10"
       [class]="collapsed() ? 'justify-center' : 'justify-between'">
    <div class="flex items-center gap-3">
      <!-- Logo icon -->
      <div class="w-10 h-10 rounded-xl flex items-center justify-center shrink-0"
           style="background: linear-gradient(135deg, #6366f1, #a855f7);">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-white" fill="none"
             viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
        </svg>
      </div>
      @if (!collapsed()) {
        <div>
          <p class="text-white font-bold text-sm leading-tight">EMS Admin</p>
          <p class="text-purple-300 text-xs">Employee Management</p>
        </div>
      }
    </div>
  </div>

  <!-- Navigation -->
  <nav class="flex-1 px-3 py-6 space-y-1 overflow-y-auto">
    @if (!collapsed()) {
      <p class="text-xs font-semibold text-slate-500 uppercase tracking-widest mb-3 px-3">Main Menu</p>
    }

    @for (item of navItems; track item.route) {
      <a [routerLink]="item.route"
         routerLinkActive="nav-active"
         [routerLinkActiveOptions]="{ exact: false }"
         class="nav-link group flex items-center gap-3 px-3 py-2.5 rounded-xl transition-all duration-200 cursor-pointer"
         [class]="collapsed() ? 'justify-center' : ''">
        <span class="shrink-0 text-slate-400 group-[.nav-active]:text-white transition-colors"
              [innerHTML]="item.icon"></span>
        @if (!collapsed()) {
          <span class="text-sm font-medium text-slate-400 group-[.nav-active]:text-white transition-colors">
            {{ item.label }}
          </span>
        }
      </a>
    }
  </nav>

  <!-- Collapse Toggle -->
  <div class="px-3 py-4 border-t border-white/10">
    <button (click)="toggle()"
            class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-400 hover:text-white hover:bg-white/10 transition-all duration-200"
            [class]="collapsed() ? 'justify-center' : ''">
      @if (collapsed()) {
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 5l7 7-7 7M5 5l7 7-7 7"/>
        </svg>
      } @else {
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 19l-7-7 7-7m8 14l-7-7 7-7"/>
        </svg>
        <span class="text-sm font-medium">Collapse</span>
      }
    </button>
  </div>
</aside>
