<aside
  class="h-screen flex flex-col transition-all duration-300 ease-in-out select-none"
  [class]="collapsed() ? 'w-20' : 'w-64'"
  style="background: linear-gradient(180deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);"
>
  <!-- Logo & Brand -->
  <div class="flex items-center px-2 py-3 border-b border-white/10"
       [class]="collapsed() ? 'justify-center' : 'justify-between'">
    <div class="flex items-center gap-1">
      <!-- Logo image -->
      <img src="/logo.png"
           alt="GB Creations Logo"
           class="w-12 h-12 object-contain shrink-0"
           [class]="collapsed() ? 'w-8 h-8' : 'w-10 h-10'">
      @if (!collapsed()) {
        <div>
          <p class="text-white font-bold text-sm leading-tight">GB Creations</p>
          <p class="text-purple-300 text-xs">Employee Management System</p>
        </div>
      }
    </div>
  </div>

  <!-- Navigation -->
  <nav class="flex-1 px-3 py-6 space-y-1 overflow-y-auto">

    @for (item of navItems; track item.route) {
      <a [routerLink]="item.route"
         routerLinkActive="nav-active"
         [routerLinkActiveOptions]="{ exact: false }"
         class="nav-link group flex items-center gap-3 px-3 py-2.5 rounded-xl transition-all duration-200 cursor-pointer hover:bg-white/10"
         [class]="collapsed() ? 'justify-center' : ''">
        <span class="shrink-0 text-slate-400 group-[.nav-active]:text-white transition-colors"
              [innerHTML]="getSafeIcon(item.icon)"></span>
        @if (!collapsed()) {
          <span class="text-sm font-medium text-slate-400 group-[.nav-active]:text-white transition-colors">
            {{ item.label }}
          </span>
        }
      </a>
    }
  </nav>

  <!-- Collapse Toggle -->
  <div class="px-3 py-4 border-t border-white/10">
    <button (click)="toggle()"
            class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-400 hover:text-white hover:bg-white/10 transition-all duration-200 cursor-pointer"
            [class]="collapsed() ? 'justify-center' : ''">
      @if (collapsed()) {
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 5l7 7-7 7M5 5l7 7-7 7"/>
        </svg>
      } @else {
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 19l-7-7 7-7m8 14l-7-7 7-7"/>
        </svg>
        <span class="text-sm font-medium">Collapse</span>
      }
    </button>
  </div>
</aside>
