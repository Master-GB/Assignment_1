<div class="fixed top-4 right-4 z-[100] flex flex-col gap-2 pointer-events-none">
  @for (toast of toasts; track toast.id) {
    <div 
      [ngClass]="getStyles(toast.type).bg"
      class="pointer-events-auto flex items-start gap-3 px-4 py-3 rounded-xl border shadow-lg min-w-[300px] max-w-md animate-[slideInRight_0.3s_ease-out]"
      [style.border-color]="getStyles(toast.type).border"
    >
      <!-- Icon -->
      <div [ngClass]="getStyles(toast.type).icon" class="shrink-0 mt-0.5" [innerHTML]="getIcon(toast.type)"></div>
      
      <!-- Message -->
      <div class="flex-1">
        <p class="text-sm font-medium text-slate-800">{{ toast.message }}</p>
      </div>
      
      <!-- Close button -->
      <button 
        (click)="remove(toast.id)"
        class="shrink-0 text-slate-400 hover:text-slate-600 transition-colors cursor-pointer"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>
  }
</div>

<style>
  @keyframes slideInRight {
    from {
      transform: translateX(100%);
      opacity: 0;
    }
    to {
      transform: translateX(0);
      opacity: 1;
    }
  }
</style>
